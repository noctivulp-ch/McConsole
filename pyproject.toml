[project]
name = "mc-console"
version = "0.5.0"
description = "Consola local/remota para servidores Minecraft: log en vivo + RCON + control del proceso (TUI para humanos, CLI para scripts y agentes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=8.2,<9",
    "rich>=13",
]

[project.scripts]
mc-console = "mcconsole.app:main"
mc-rcon = "mcconsole.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcconsole"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
